name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulsepay_test
          POSTGRES_USER: pulsepay
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pulsepay -d pulsepay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create disposable restore database
        run: /usr/lib/postgresql/16/bin/createdb --host=127.0.0.1 --port=5432 --username=pulsepay pulsepay_restore_test

      - name: Run tests
        env:
          # SQLite suite is configured inside tests/conftest.py. The concurrency
          # tests use this URL to exercise real FOR UPDATE SKIP LOCKED behavior.
          TEST_POSTGRES_URL: postgresql+psycopg://pulsepay@127.0.0.1:5432/pulsepay_test
          TEST_BACKUP_POSTGRES_URL: postgresql+psycopg://pulsepay@127.0.0.1:5432/pulsepay_restore_test
          TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: |
          python -m pytest -v --junitxml=backend-test-results.xml
          python - <<'PYTEST_REPORT'
          import xml.etree.ElementTree as ET
          suites = ET.parse("backend-test-results.xml").getroot().iter("testsuite")
          assert sum(int(suite.get("skipped", 0)) for suite in suites) == 0, "CI must execute all PostgreSQL tests"
          PYTEST_REPORT

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit public frontend dependencies
        run: npm audit --audit-level=high


  browser:
    name: Browser integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulsepay_browser_test
          POSTGRES_USER: pulsepay_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pulsepay_test -d pulsepay_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Install isolated test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser integration with synthetic Stripe
        working-directory: frontend
        env:
          E2E_POSTGRES_URL: postgresql+psycopg://pulsepay_test@127.0.0.1:5432/pulsepay_browser_test
        run: npm run test:e2e
