services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsepay
      POSTGRES_USER: pulsepay
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsepay -d pulsepay"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
    secrets:
      - database_url
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
    secrets:
      - database_url
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

secrets:
  postgres_password:
    file: ${PULSEPAY_POSTGRES_PASSWORD_FILE:?Configure an external password file}
  database_url:
    file: ${PULSEPAY_DATABASE_URL_FILE:?Configure an external database URL file}

volumes:
  postgres_data:
