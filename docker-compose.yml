services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsepay
      POSTGRES_USER: pulsepay
      POSTGRES_PASSWORD: pulsepay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsepay -d pulsepay"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://pulsepay:pulsepay@postgres:5432/pulsepay
      APP_ENV: development
      PAYMENT_MAX_RETRIES: 3
      PAYMENT_RETRY_DELAY_SECONDS: 5
      PAYMENT_RANDOM_FAILURE_RATE: 0.1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://pulsepay:pulsepay@postgres:5432/pulsepay
      APP_ENV: development
      PAYMENT_MAX_RETRIES: 3
      PAYMENT_RETRY_DELAY_SECONDS: 5
      PAYMENT_RANDOM_FAILURE_RATE: 0.1
      WORKER_POLL_INTERVAL_SECONDS: 2
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
